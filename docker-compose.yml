services:
  twinsync:
    build: .
    image: twinsync:local
    ports:
      - "${TWINSYNC_PORT:-8080}:8080"
    environment:
      # All optional. Read from a local .env file (see .env.example) or your shell; they stay server-side.
      # No key = demo mode (rules, demo catalog, templates), clearly labelled in the UI.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_REASONING_EFFORT: ${AI_REASONING_EFFORT:-low}
      AI_MAX_CALLS: ${AI_MAX_CALLS:-600}
    volumes:
      # Permanent memory: personas, uploaded sources, confirmed profiles, decisions.
      - twinsync-data:/app/data
    restart: unless-stopped

volumes:
  twinsync-data:
